GITHUB_REPO = "arankine9/acosta-roofing"
BASE_BRANCH = "main"
DRAFT_BRANCH = "content-draft"
ALLOWED_EMAILS = "christian@acostaroofingpnw.com,arankine909@gmail.com"
PREVIEW_URL = "https://content-draft.acosta-roofing-eb8.pages.dev/"
