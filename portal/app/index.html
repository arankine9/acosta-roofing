<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#24503c" />
    <title>Website editor · Acosta Roofing</title>
    <link rel="icon" href="/site/favicon.svg" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body class="sheet-open">
    <header class="topbar">
      <div class="brand">
        <img src="/site/mark.svg" alt="" width="40" height="18" />
        <span class="brand-name">Acosta Roofing</span>
        <span class="brand-sub">Website editor</span>
      </div>

      <label class="picker">
        <span class="visually-hidden">Page</span>
        <select id="page-picker" aria-label="Choose a page to edit"><option value="/site/">Home</option></select>
      </label>

      <div id="status" class="status" data-kind="busy" role="status" aria-live="polite"><span class="dot"></span><span class="status-text">Loading…</span></div>

      <div class="width-toggle" role="group" aria-label="Preview width">
        <button type="button" class="icon-btn" data-width="desktop" aria-pressed="true" title="Computer width" aria-label="Computer width"></button>
        <button type="button" class="icon-btn" data-width="phone" aria-pressed="false" title="Phone width" aria-label="Phone width"></button>
      </div>

      <div class="actions">
        <button type="button" id="btn-preview" class="btn btn-plain">Preview</button>
        <button type="button" id="btn-save" class="btn btn-secondary" disabled>Save draft</button>
        <button type="button" id="btn-publish" class="btn btn-primary" disabled>Publish<span class="long"> to website</span></button>
        <div class="more">
          <button type="button" id="btn-more" class="icon-btn" aria-label="More" title="More" aria-haspopup="menu"></button>
          <div id="more-menu" class="menu" role="menu" hidden>
            <button type="button" id="btn-preview-menu" role="menuitem" class="menu-item phone-only">Preview the draft</button>
            <button type="button" id="btn-discard" role="menuitem" class="menu-item danger">Discard draft…</button>
            <p id="me" class="menu-note"></p>
          </div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section id="canvas" class="canvas" aria-label="The page you're editing">
        <div id="tip" class="tip" role="note">
          <p><strong>Click any words on the page to change them.</strong> Click a photo to replace it. Point at an item in a list to move, add or remove it.</p>
          <button type="button" id="tip-close" class="btn btn-plain btn-small">Got it</button>
        </div>
        <div class="frame-wrap">
          <iframe id="site" title="Your website, ready to edit"></iframe>
          <div id="loading" class="loading"><p>Loading your website…</p></div>
        </div>
      </section>

      <aside id="panel" class="panel" aria-label="Page settings, business info and history">
        <div class="sheet-handle">
          <button type="button" id="btn-sheet" class="sheet-toggle">Page settings · Business info · History</button>
          <button type="button" id="sheet-close" class="icon-btn" aria-label="Close panel">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6" /></svg>
          </button>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="page" aria-selected="true">This page</button>
          <button type="button" role="tab" data-tab="business" aria-selected="false">Business info</button>
          <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
        </div>
        <div class="panel-scroll">
          <section data-section="page"><div class="page-body"></div></section>
          <section data-section="business" hidden><form class="biz-body" onsubmit="return false"></form></section>
          <section data-section="history" hidden><div class="history-body"></div></section>
        </div>
      </aside>
    </main>
  </body>
</html>
